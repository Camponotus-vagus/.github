name: Bug report
description: Something went wrong or gave an unexpected result.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you are using.
      placeholder: "v1.2.0"
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system and version, computer or browser.
      placeholder: "macOS 26.1 on a MacBook Air M3 / Windows 11 / Firefox 140"
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The steps, and the kind and size of the input if it matters.
  - type: textarea
    id: log
    attributes:
      label: Log or error message
      description: Paste it as text. Logs can contain file names and paths, so remove anything you'd rather not share.
      render: text
